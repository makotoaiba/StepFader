name: Build (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect package
        shell: pwsh
        run: |
          $dest = "dist/StepFader"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item -Recurse "build/StepFader_artefacts/Release/VST3/Step Fader.vst3" $dest
          Copy-Item "install_for_test.bat","README.md" $dest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepFader-windows
          path: dist/StepFader
